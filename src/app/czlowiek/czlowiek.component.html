<div *ngFor="let czlowiek of listaLudzi">
  <p style="font-weight: bold;">Nazwa użytkownika: {{czlowiek.nazwa}}</p>
  <p style="font-style: italic;">Email: {{czlowiek.email}}</p>
  <p>Ocena: {{czlowiek.ocena}}</p>
  <p>Wybrany zawód: {{czlowiek.zawod}}</p>
  <p>Płeć: {{czlowiek.plec}}</p>
  <p>Wiek: {{czlowiek.wiek}}</p>
  <p>Zainteresowania: {{czlowiek.zainteresowania}}</p>
  <hr>
</div>
