<div *ngFor="let czlowiek of listaLudzi">
  <p>Nazwa: {{czlowiek.nazwa}}</p>
  <p>Email: {{czlowiek.email}}</p>
  <p>Ocena: {{czlowiek.ocena}}</p>
  <p>Zawód: {{czlowiek.zawod}}</p>
  <p>Plec: {{czlowiek.plec}}</p>
  <p>Wiek: {{czlowiek.wiek}}</p>
  <p>Zainteresowania: {{czlowiek.zainteresowania}}</p>
</div>
